<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><rect width="1440" height="760" fill="#fff"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#253044"><rect x="45" y="95" width="235" height="110" rx="18" fill="#eaf2ff" stroke="#a4c7f5"/><text x="162" y="138" font-size="25" font-weight="bold">Prospect</text><text x="162" y="173" font-size="18">Discovery + scope</text><rect x="345" y="95" width="245" height="110" rx="18" fill="#f0ecff" stroke="#c6b7fa"/><text x="467" y="138" font-size="25" font-weight="bold">ORTHDX / Rep</text><text x="467" y="173" font-size="18">ClickUp + proposal</text><rect x="655" y="95" width="245" height="110" rx="18" fill="#e9faf5" stroke="#a4dfd0"/><text x="777" y="138" font-size="25" font-weight="bold">Stripe</text><text x="777" y="173" font-size="18">Customer pays</text><rect x="965" y="95" width="430" height="110" rx="18" fill="#eaf2ff" stroke="#a4c7f5"/><text x="1180" y="138" font-size="25" font-weight="bold">Corex CRM</text><text x="1180" y="173" font-size="18">Paid project → build + support</text><rect x="65" y="355" width="590" height="295" rx="24" fill="#faf8ff" stroke="#c6b7fa"/><text x="360" y="401" font-size="26" font-weight="bold">Build fee</text><text x="360" y="435" font-size="18">Example: $2,100 collected</text><rect x="103" y="475" width="390" height="44" rx="8" fill="#a58df0"/><rect x="493" y="475" width="97" height="44" rx="8" fill="#83c6f2"/><text x="298" y="505" font-size="21" fill="white" font-weight="bold">80% ORTHDX pool · $1,680</text><text x="542" y="546" font-size="19">20% Corex</text><text x="542" y="573" font-size="19">$420</text><text x="360" y="611" font-size="18">Rep / override / retained split: confirm</text><rect x="785" y="355" width="590" height="295" rx="24" fill="#f4fcf9" stroke="#a4dfd0"/><text x="1080" y="401" font-size="26" font-weight="bold">Monthly recurring</text><text x="1080" y="435" font-size="18">$250 collected − $50 direct cost = $200</text><re